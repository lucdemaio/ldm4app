name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      # Build traduttore app
      - name: Build traduttore
        run: |
          cd traduttore
          npm install
          npm run build
      
      # Prepare deployment directory
      - name: Prepare deployment
        run: |
          mkdir -p deploy
          # Copy original index.html to root
          cp index.html deploy/
          cp CNAME deploy/
          cp .nojekyll deploy/
          # Copy traduttore build
          cp -r traduttore/dist/* deploy/traduttore/
      
      # Deploy to gh-pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          cname: www.ldm4app.com
