name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci
        working-directory: traduttore

      - name: Build
        run: npm run build
        working-directory: traduttore

      - name: Prepare deployment directory
        run: |
          mkdir -p _site
          cp -r * _site/ 2>/dev/null || true
          rm -rf _site/traduttore/dist
          rm -rf _site/traduttore/node_modules
          rm -rf _site/traduttore/src
          rm -rf _site/_site
          rm -rf _site/.git
          mkdir -p _site/traduttore
          cp -r traduttore/dist/* _site/traduttore/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          force_orphan: true
