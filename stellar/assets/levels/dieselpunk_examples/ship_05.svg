<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <rect width="32" height="32" fill="#000" />
  <!-- Compact scout ship -->
  <ellipse cx="16" cy="16" rx="8" ry="5" fill="#5a6a4e" stroke="#222" stroke-width="0.18" />
  <!-- Twin forward guns -->
  <rect x="10" y="13" width="3" height="1" fill="#4b4b4b" />
  <rect x="19" y="13" width="3" height="1" fill="#4b4b4b" />
  <!-- Porthole -->
  <circle cx="16" cy="14" r="0.8" fill="#98c6d9" />
  <!-- Exposed rivets -->
  <g fill="#333">
    <circle cx="8" cy="16" r="0.45" />
    <circle cx="24" cy="16" r="0.45" />
  </g>
  <!-- Rust blotches -->
  <path d="M12 18c0.9 0.8 2.6 1.1 4 0.6" stroke="#7a4a2c" stroke-width="0.7" stroke-linecap="round" fill="none" />
</svg>