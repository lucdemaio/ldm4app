<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <rect width="32" height="32" fill="#000" />
  <!-- Chunky armored ship, more industrial -->
  <rect x="3" y="11" width="26" height="9" rx="3" fill="#495049" stroke="#232422" stroke-width="0.2" />
  <!-- Access hatch and rivet rows -->
  <rect x="12" y="12.6" width="8" height="4" fill="#8aa3a2" opacity="0.9" />
  <g fill="#2b2b27">
    <circle cx="6" cy="14.5" r="0.45" />
    <circle cx="26" cy="14.5" r="0.45" />
    <circle cx="16" cy="19" r="0.45" />
  </g>
  <!-- Side cannons -->
  <rect x="0.5" y="15" width="3" height="1.2" fill="#3d3d3d" />
  <rect x="28.5" y="15" width="3" height="1.2" fill="#3d3d3d" />
  <!-- Rust streaks -->
  <path d="M10 20c1-0.2 2.2-0.4 3.5-0.3" stroke="#7c452a" stroke-width="0.6" stroke-linecap="round" fill="none" />
</svg>