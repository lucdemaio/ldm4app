<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <rect width="32" height="32" fill="#000" />
  <!-- Hull -->
  <ellipse cx="16" cy="17" rx="11" ry="6" fill="#4f5b36" stroke="#2f3726" stroke-width="0.2" />
  <!-- Conning tower -->
  <rect x="12.5" y="10" width="7" height="5" rx="1" ry="1" fill="#6b7a45" stroke="#2f3726" stroke-width="0.2"/>
  <!-- Cockpit window -->
  <rect x="13.5" y="11" width="3" height="2" fill="#cfe8ff" opacity="0.95"/>
  <!-- Rivets -->
  <g fill="#3b3b33">
    <circle cx="5" cy="17" r="0.6" />
    <circle cx="9" cy="16" r="0.6" />
    <circle cx="23" cy="16" r="0.6" />
    <circle cx="27" cy="17" r="0.6" />
  </g>
  <!-- Cannons -->
  <rect x="2" y="15.2" width="4" height="1" fill="#45423f" />
  <rect x="26" y="15.2" width="4" height="1" fill="#45423f" />
  <!-- Rear propeller -->
  <g transform="translate(16,24)">
    <rect x="-1" y="-1.5" width="2" height="3" fill="#6b6b6b" />
    <rect x="-4" y="-0.5" width="8" height="1" fill="#3a3a3a" />
  </g>
  <!-- Rust patches -->
  <path d="M9 18c1.2 0.2 3 0.3 4.5-0.3" fill="none" stroke="#7a4428" stroke-width="0.9" stroke-linecap="round" opacity="0.9" />
  <path d="M21 18c-1.5 0.4-3 0.6-4.2 0.2" fill="none" stroke="#7a4428" stroke-width="0.9" stroke-linecap="round" opacity="0.9" />
</svg>