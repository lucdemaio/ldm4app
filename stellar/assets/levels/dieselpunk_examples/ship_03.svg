<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <rect width="32" height="32" fill="#000" />
  <!-- Sleeker hull, submarine-like -->
  <path d="M5 18c2-5 8-6 11-6s9 1 11 6" fill="#6b6f5f" stroke="#2b2b25" stroke-width="0.2" />
  <!-- Central turret -->
  <rect x="14" y="9" width="4" height="4" rx="0.4" fill="#5a5a4a" />
  <rect x="15.5" y="10.5" width="1" height="2" fill="#b6d9ff" />
  <!-- Small thrusters -->
  <g fill="#3b3b3b">
    <rect x="10" y="21" width="3" height="1" />
    <rect x="19" y="21" width="3" height="1" />
  </g>
  <!-- Big side gun -->
  <rect x="1" y="13.8" width="6" height="1.3" fill="#4b4b47" />
  <!-- Rivets and rust -->
  <circle cx="7.5" cy="17.2" r="0.5" fill="#2f2f2d" />
  <path d="M21 18c-0.9-0.1-2 0-3 0.2" stroke="#7b4928" stroke-width="0.7" stroke-linecap="round" fill="none" />
</svg>