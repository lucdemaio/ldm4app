<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <rect width="32" height="32" fill="#000" />
  <!-- Heavy gunship, flat top -->
  <rect x="3" y="12" width="26" height="8" rx="2" fill="#525a4c" stroke="#111" stroke-width="0.18" />
  <!-- Big forward gun -->
  <rect x="6" y="13.6" width="8" height="1.2" fill="#3f3f3f" />
  <rect x="18" y="13.6" width="8" height="1.2" fill="#3f3f3f" />
  <!-- Big rivet row -->
  <g fill="#1f1f1c">
    <circle cx="9" cy="16" r="0.5" />
    <circle cx="16" cy="15.8" r="0.5" />
    <circle cx="23" cy="16" r="0.5" />
  </g>
  <!-- Rust streaks and scratches -->
  <path d="M10 19c1.2-0.2 3-0.5 4.5-0.4" stroke="#7d4529" stroke-width="0.9" stroke-linecap="round" fill="none" opacity="0.95" />
</svg>