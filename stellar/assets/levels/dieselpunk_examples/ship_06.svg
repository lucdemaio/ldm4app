  <rect x="2" y="14.6" width="4" height="1" fill="#4b4b4b" />
  <rect x="26" y="14.6" width="4" height="1" fill="#4b4b4b" />
  <!-- Rivet clusters -->
  <g fill="#2a2a24">
    <circle cx="10" cy="16.2" r="0.45" />
    <circle cx="13" cy="15.8" r="0.45" />
    <circle cx="19" cy="15.8" r="0.45" />
    <circle cx="22" cy="16.2" r="0.45" />
  </g>
