<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mission Viewer</title>
    <meta name="theme-color" content="#0b6b4f">
    <meta name="description" content="Mission Viewer - Novità, progetti, eventi e impatto della missione">
    <link rel="stylesheet" href="assets/css/mission.css">
    <style>
        body { background: #f6f8fa; }
        .viewer-header { display:flex; align-items:center; gap:1.2rem; margin-bottom:2rem; }
        .viewer-logo { width:56px; height:56px; border-radius:18px; background:#0b6b4f; display:flex; align-items:center; justify-content:center; color:#fff; font-size:2.2rem; font-weight:700; }
        .viewer-title { font-size:2.2rem; font-weight:700; color:#0b6b4f; }
        .bento-dashboard-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:1.5rem; margin-bottom:2.5rem; }
        .viewer-card { background:#fff; border-radius:24px; box-shadow:0 4px 24px rgba(0,0,0,0.07); padding:1.5rem; transition:box-shadow .18s,transform .18s; cursor:pointer; position:relative; }
        .viewer-card.large { grid-column:span 2; min-height:220px; }
        .viewer-card.medium { min-height:160px; }
        .viewer-card.small { min-height:90px; font-size:1.1rem; }
        .viewer-card:hover { box-shadow:0 8px 32px rgba(0,0,0,0.13); transform:translateY(-7px) scale(1.03); }
        .viewer-card img { border-radius:24px; width:100%; max-height:140px; object-fit:cover; margin-bottom:0.7rem; }
        .impact-pill { display:inline-block; background:#e6f7ee; color:#0b6b4f; border-radius:16px; padding:0.2em 0.9em; font-size:0.98em; margin-top:0.7em; }
        .date-pill { display:inline-block; color:#888; font-size:0.95em; margin-top:0.5em; margin-left:0.5em; }
        .viewer-feed { background:#fff; border-radius:18px; box-shadow:0 2px 12px rgba(0,0,0,0.06); padding:1.2rem 1.5rem; }
        .feed-item { border-bottom:1px solid #f0f0f0; padding:1.1rem 0; }
        .feed-item:last-child { border-bottom:none; }
        .feed-type { font-size:0.98em; color:#0b6b4f; font-weight:600; }
        .feed-title { font-size:1.18em; font-weight:600; margin:0.2em 0; }
        .feed-date { color:#888; font-size:0.98em; }
        .feed-summary { color:#222; margin-top:0.2em; }
        @media (max-width:600px) { .bento-dashboard-grid { grid-template-columns:1fr; } .viewer-header { flex-direction:column; align-items:flex-start; } }
    </style>
</head>
<body>
    <div class="viewer-header">
        <div class="viewer-logo">MV</div>
        <div class="viewer-title">Mission Viewer</div>
    </div>
    <div id="viewer-bento-grid" class="bento-dashboard-grid"></div>
    <div id="viewer-feed" class="viewer-feed"></div>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/storage.js"></script>
    <script src="assets/js/viewer.js"></script>
</body>
</html>
