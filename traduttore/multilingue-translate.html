<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    
    <script>
      window.__MULTILINGUE_TRANSLATE_VERSION__ = 'v1';
      console.log('[MULTILINGUE TRANSLATE HEAD] Versione traduzione multilingue caricata');
    </script>
    
    <script>
      console.log('[MULTILINGUE TRANSLATE HTML FIRST] EMERGENCY CACHE CLEAR START')
      
      if (typeof caches !== 'undefined') {
        caches.keys().then((names) => {
          console.log('[MULTILINGUE TRANSLATE HTML] deleting caches:', names)
          names.forEach(name => caches.delete(name))
        })
      }
      
      if (typeof navigator !== 'undefined' && navigator.serviceWorker) {
        navigator.serviceWorker.getRegistrations().then((regs) => {
          console.log('[MULTILINGUE TRANSLATE HTML] unregistering SWs:', regs.length)
          regs.forEach(reg => reg.unregister())
        })
      }
    </script>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="pwa-192x192.svg">
    <title>Traduzioni - Ldm4app</title>
    <script>
      console.log('[MULTILINGUE TRANSLATE HTML] multilingue-translate.html loaded')
      window.DEBUG = true
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main-multilingue-translate.jsx"></script>
  </body>
</html>
