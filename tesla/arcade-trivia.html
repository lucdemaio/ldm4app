                { q: "Quale è la formula dell'acido cloridrico?", a: ["HCl", "HClO", "Cl₂", "HClO₄"], correct: 0 },
                { q: "Quale è la formula della soda caustica?", a: ["NaOH", "Na₂OH", "NaOH₂", "NaO"], correct: 0 },
                { q: "Quale è la formula dell'ammoniaca?", a: ["NH₂", "NH₃", "N₂H", "NH₄"], correct: 1 },
                { q: "Chi ha scoperto l'ammoniaca sintetica?", a: ["Fritz Haber", "Carl Bosch", "Haber e Bosch", "August Wilhelm von Hofmann"], correct: 2 },
                { q: "Quale numero atomico ha l'oro?", a: ["47", "79", "92", "118"], correct: 1 },
                { q: "Quale numero atomico ha l'argento?", a: ["47", "79", "92", "118"], correct: 0 },
                { q: "Quale numero atomico ha l'uranio?", a: ["47", "79", "92", "118"], correct: 2 },
                { q: "Quale elemento ha il numero atomico 1?", a: ["Elio", "Idrogeno", "Litio", "Neon"], correct: 1 },
                { q: "Quale elemento ha il numero atomico 2?", a: ["Elio", "Idrogeno", "Litio", "Neon"], correct: 0 },
                { q: "Quale elemento ha il numero atomico 8?", a: ["Azoto", "Ossigeno", "Fluoro", "Neon"], correct: 1 },
                { q: "Quale elemento ha il numero atomico 6?", a: ["Carbonio", "Azoto", "Berillio", "Boro"], correct: 0 },
                { q: "Quale è il punto di fusione dell'acqua?", a: ["0°C", "32°F", "273 K", "Tutti corretti"], correct: 3 },
                { q: "Quale è il punto di ebollizione dell'acqua?", a: ["100°C", "212°F", "373 K", "Tutti corretti"], correct: 3 },
                { q: "Quale è il peso atomico del carbonio?", a: ["12", "12.01", "12.11", "13"], correct: 1 },
                { q: "Quale è il peso atomico dell'ossigeno?", a: ["15.99", "16", "16.01", "17"], correct: 0 },
                { q: "Chi ha scoperto l'elemento ferro?", a: ["Sir William Herschel", "Fu scoperto nell'antichità", "Humphry Davy", "Non è mai stato scoperto"], correct: 1 },
                { q: "Quanti elementi ci sono nella tavola periodica?", a: ["92", "100", "107", "118"], correct: 3 },
                { q: "Chi ha creato la tavola periodica?", a: ["John Newlands", "Dmitri Mendeleev", "Julius Lothar Meyer", "Primo Levi"], correct: 1 },
                { q: "Quale è la densità dell'oro?", a: ["15.3 g/cm³", "19.3 g/cm³", "21.3 g/cm³", "23.3 g/cm³"], correct: 1 },
                { q: "Quale è il metallo più denso?", a: ["Uranio", "Osmio", "Iridio", "Tungsteno"], correct: 1 },
                { q: "Quale è il metallo meno denso?", a: ["Idrogeno", "Litio", "Magnesio", "Alluminio"], correct: 1 }
            ]
        };

        let currentCategory = 'storia';
        let currentQuestions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let answered = false;
        let playerName = '';
        const GAME_NAME = 'trivia';

        // Funzioni per gestire localStorage
        function saveScore(category, name, score, total) {
            const key = `${GAME_NAME}_${category}`;
            let scores = JSON.parse(localStorage.getItem(key) || '[]');
            scores.push({
                name: name || 'Anonimo',
                score: score,
                total: total,
                percentage: Math.round((score / total) * 100),
                date: new Date().toLocaleDateString('it-IT')
            });
            scores.sort((a, b) => b.score - a.score || b.percentage - a.percentage);
            localStorage.setItem(key, JSON.stringify(scores.slice(0, 20))); // Top 20
        }

        function getLeaderboard(category) {
            const key = `${GAME_NAME}_${category}`;
            return JSON.parse(localStorage.getItem(key) || '[]');
        }

        function showLeaderboard() {
            const categoryLabels = { storia: '📚 Storia', geografia: '🌍 Geografia', cinema: '🎬 Cinema', scienza: '🔬 Scienza' };
            document.getElementById('leaderboardCategory').textContent = categoryLabels[currentCategory];
            const scores = getLeaderboard(currentCategory);
            
            let html = '';
            if (scores.length === 0) {
                html = '<p class="text-gray-400">Ancora nessun punteggio registrato. Inizia il quiz!</p>';
            } else {
                scores.forEach((entry, index) => {
                    html += `
                        <div class="leaderboard-item">
                            <span class="leaderboard-rank">#${index + 1}</span>
                            <span class="leaderboard-name">${entry.name}</span>
                            <span class="leaderboard-score">${entry.score}/${entry.total} (${entry.percentage}%) - ${entry.date}</span>
                        </div>
                    `;
                });
            }
            
            document.getElementById('leaderboardList').innerHTML = html;
            document.getElementById('stastoStartScreen').style.display = 'none';
            document.getElementById('quizContent').style.display = 'none';
            document.getElementById('resultsScreen').style.display = 'none';
            document.getElementById('leaderboardScreen').style.display = 'block';
        }

        function switchCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.tab-btn').forEach(el => {
                el.classList.remove('active');
                el.classList.add('inactive');
            });
            event.target.classList.add('active');
            event.target.classList.remove('inactive');
        }

        function startQuiz() {
            const nameInput = document.getElementById('playerName').value.trim();
            if (!nameInput) {
                alert('Inserisci il tuo nome per continuare!');
                return;
            }
            playerName = nameInput;
            currentQuestions = [...quizData[currentCategory]].sort(() => Math.random() - 0.5);
            currentQuestionIndex = 0;
            score = 0;
            answered = false;
            document.getElementById('stastoStartScreen').style.display = 'none';
            document.getElementById('quizContent').style.display = 'block';
            document.getElementById('resultsScreen').style.display = 'none';
            document.getElementById('leaderboardScreen').style.display = 'none';
            showQuestion();
        }

        function showQuestion() {
            if (currentQuestionIndex >= currentQuestions.length) {
                showResults();
                return;
            }
            const q = currentQuestions[currentQuestionIndex];
            document.getElementById('question').textContent = q.q;
            document.getElementById('questionNumber').textContent = `Domanda ${currentQuestionIndex + 1} di ${currentQuestions.length}`;
            document.getElementById('score').textContent = `Punteggio: ${score}/${currentQuestions.length}`;
            document.getElementById('progressFill').style.width = `${(currentQuestionIndex / currentQuestions.length) * 100}%`;

            const container = document.getElementById('optionsContainer');
            container.innerHTML = '';
            q.a.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = option;
                btn.onclick = () => selectAnswer(index, q.correct);
                container.appendChild(btn);
            });
            answered = false;
            document.getElementById('nextBtn').style.display = 'none';
        }

        function selectAnswer(selected, correct) {
            if (answered) return;
            answered = true;
            const options = document.querySelectorAll('.option-btn');
            options.forEach((btn, idx) => {
                btn.classList.add('disabled');
                if (idx === correct) {
                    btn.classList.add('correct');
                }
                if (idx === selected && selected !== correct) {
                    btn.classList.add('wrong');
                }
            });
            if (selected === correct) {
                score++;
            }
            document.getElementById('nextBtn').style.display = 'inline-block';
            document.getElementById('score').textContent = `Punteggio: ${score}/${currentQuestions.length}`;
        }

        function nextQuestion() {
            currentQuestionIndex++;
            showQuestion();
        }

        function showResults() {
            // Salva il punteggio in localStorage
            saveScore(currentCategory, playerName, score, currentQuestions.length);
            
            document.getElementById('quizContent').style.display = 'none';
            document.getElementById('resultsScreen').style.display = 'block';
            const percentage = (score / currentQuestions.length) * 100;
            document.getElementById('finalScore').textContent = `${score}/${currentQuestions.length}`;
            
            let message = '';
            if (percentage === 100) message = '🏆 Perfetto! Sei un genio!';
            else if (percentage >= 80) message = '🌟 Ottimo risultato!';
            else if (percentage >= 60) message = '👍 Buon lavoro!';
            else if (percentage >= 40) message = '📚 Continua a studiare!';
            else message = '💪 Prova ancora!';
            
            document.getElementById('resultMessage').textContent = message;
        }

        function resetQuiz() {
            document.getElementById('stastoStartScreen').style.display = 'block';
            document.getElementById('quizContent').style.display = 'none';
            document.getElementById('resultsScreen').style.display = 'none';
            document.getElementById('leaderboardScreen').style.display = 'none';
            document.getElementById('playerName').value = '';
            playerName = '';
        }
    </script>
</body>
