<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI & Calorie</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial; background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%); color: #fff; padding: 30px; min-height: 100vh; }
        .container { max-width: 500px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 30px; font-size: 28px; }
        .form-group { margin: 20px 0; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        input, select { width: 100%; padding: 12px; background: #333; color: #fff; border: 1px solid #0066ff; border-radius: 6px; font-size: 16px; }
        input:focus, select:focus { outline: none; border-color: #00d4ff; box-shadow: 0 0 10px rgba(0, 212, 255, 0.3); }
        button { width: 100%; padding: 14px; margin-top: 20px; background: #0066ff; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 16px; transition: all 0.2s; }
        button:hover { background: #00d4ff; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0, 102, 255, 0.4); }
        .result { background: rgba(0, 102, 255, 0.1); padding: 25px; margin-top: 25px; border-radius: 8px; border-left: 4px solid #0066ff; }
        .result-item { margin: 15px 0; font-size: 18px; }
        .result-label { color: #00d4ff; font-weight: bold; }
        .result-value { color: #51cf66; font-size: 24px; font-weight: bold; margin-top: 5px; }
        .bmi-status { padding: 10px; border-radius: 5px; margin-top: 10px; font-weight: bold; }
        .status-underweight { background: rgba(100, 200, 255, 0.3); color: #64c8ff; }
        .status-normal { background: rgba(81, 207, 102, 0.3); color: #51cf66; }
        .status-overweight { background: rgba(255, 165, 0, 0.3); color: #ffa500; }
        .status-obese { background: rgba(255, 107, 107, 0.3); color: #ff6b6b; }
    </style>
</head>
<body>
    <div class="container">
        <h1>💪 BMI & Calorie Calculator</h1>

        <div class="form-group">
            <label>Altezza (cm):</label>
            <input type="number" id="height" placeholder="170" min="50" max="250">
        </div>

        <div class="form-group">
            <label>Peso (kg):</label>
            <input type="number" id="weight" placeholder="70" min="10" max="500">
        </div>

        <div class="form-group">
            <label>Eta:</label>
            <input type="number" id="age" placeholder="30" min="1" max="120">
        </div>

        <div class="form-group">
            <label>Genere:</label>
            <select id="gender">
                <option>Maschio</option>
                <option>Femmina</option>
            </select>
        </div>

        <div class="form-group">
            <label>Livello di Attivita:</label>
            <select id="activity">
                <option value="1.2">Sedentaria (poco esercizio)</option>
                <option value="1.375">Leggera (1-3 giorni/settimana)</option>
                <option value="1.55" selected>Moderata (3-5 giorni/settimana)</option>
                <option value="1.725">Intensa (6-7 giorni/settimana)</option>
                <option value="1.9">Molto Intensa (attivita quotidiana)</option>
            </select>
        </div>

        <button onclick="calculate()">📊 Calcola</button>

        <div id="result" style="display: none;" class="result">
            <div class="result-item">
                <div class="result-label">Indice di Massa Corporea (BMI):</div>
                <div class="result-value" id="bmiValue">--</div>
                <div id="bmiStatus" class="bmi-status"></div>
            </div>

            <div class="result-item">
                <div class="result-label">Metabolismo Basale (BMR):</div>
                <div class="result-value" id="bmrValue">--</div>
            </div>

            <div class="result-item">
                <div class="result-label">Calorie Giornaliere (TDEE):</div>
                <div class="result-value" id="tdeeValue">--</div>
                <p style="margin-top: 10px; color: #aaa; font-size: 14px;" id="advice"></p>
            </div>

            <div class="result-item">
                <div class="result-label">Intervallo di Peso Ideale:</div>
                <div class="result-value" id="idealWeight">--</div>
            </div>
        </div>
    </div>

    <script>
        function calculate() {
            let h = parseFloat(document.getElementById('height').value);
            let w = parseFloat(document.getElementById('weight').value);
            let age = parseInt(document.getElementById('age').value);
            let gender = document.getElementById('gender').value;
            let activity = parseFloat(document.getElementById('activity').value);

            if (!h || !w || !age) {
                alert('Compila tutti i campi!');
                return;
            }

            let heightM = h / 100;
            let bmi = (w / (heightM * heightM)).toFixed(1);
            
            let bmr = gender === 'Maschio' 
                ? (88.362 + (13.397 * w) + (4.799 * h) - (5.677 * age)).toFixed(0)
                : (447.593 + (9.247 * w) + (3.098 * h) - (4.330 * age)).toFixed(0);
            
            let tdee = (bmr * activity).toFixed(0);
            
            let status = '';
            let statusClass = '';
            if (bmi < 18.5) {
                status = 'Sottopeso';
                statusClass = 'status-underweight';
            } else if (bmi < 25) {
                status = 'Peso Normale';
                statusClass = 'status-normal';
            } else if (bmi < 30) {
                status = 'Sovrappeso';
                statusClass = 'status-overweight';
            } else {
                status = 'Obeso';
                statusClass = 'status-obese';
            }

            let minIdeal = (25 * heightM * heightM).toFixed(1);
            let maxIdeal = (24.9 * heightM * heightM).toFixed(1);

            let advice = '';
            if (tdee < 1500) {
                advice = 'Aumenta l\'apporto calorico gradualmente';
            } else if (tdee < 2000) {
                advice = 'Mantieni una dieta equilibrata e varia';
            } else {
                advice = 'Aumenta l\'attivita fisica se vuoi perdere peso';
            }

            document.getElementById('bmiValue').innerText = bmi;
            document.getElementById('bmiStatus').className = 'bmi-status ' + statusClass;
            document.getElementById('bmiStatus').innerText = status;
            document.getElementById('bmrValue').innerText = bmr + ' cal/giorno';
            document.getElementById('tdeeValue').innerText = tdee + ' cal/giorno';
            document.getElementById('idealWeight').innerText = minIdeal + ' - ' + maxIdeal + ' kg';
            document.getElementById('advice').innerText = advice;

            document.getElementById('result').style.display = 'block';
        }

        // Calcola al caricamento se presenti valori di default
        window.addEventListener('load', () => {
            document.getElementById('height').value = '170';
            document.getElementById('weight').value = '70';
            document.getElementById('age').value = '30';
        });
    </script>
    <div style="text-align: center; margin-top: 30px; padding-top: 20px; border-top: 1px solid #0066ff;">
        <a href="utilita.html" style="display: inline-block; padding: 12px 30px; background: linear-gradient(135deg, #0066ff, #00d4ff); color: white; text-decoration: none; border-radius: 8px; font-weight: bold; margin: 10px auto; transition: all 0.3s;" onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 5px 15px rgba(0,102,255,0.4)';" onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='none';">← Torna al menù Utilità</a>
    </div>
</body>
</html>
