<!doctype html>
<meta charset="utf-8">
<title>Page not found</title>
<script>
  // GitHub Pages / static host SPA fallback for /tornei/*
  (function(){
    try{
      var fullPath = location.pathname + location.search + location.hash;
      var path = location.pathname;
      
      // If request was for a SPA path under /tornei/, save it and redirect to index
      if(path.startsWith('/tornei/') && path !== '/tornei/404.html' && path !== '/tornei/index.html'){
        localStorage.setItem('spa-redirect-path', fullPath);
        localStorage.setItem('spa-redirect-time', Date.now().toString());
        location.replace('/tornei/index.html' + location.search + location.hash);
      }else{
        // For non-SPA paths, go to root
        location.replace('/');
      }
    }catch(e){
      // If anything fails, go to root
      location.replace('/');
    }
  })();
</script>
<body>If you are not redirected automatically, <a href="/tornei/">click here to open the app</a>.</body>
