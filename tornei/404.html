<!doctype html>
<meta charset="utf-8">
<title>Page not found</title>
<script>
  // GitHub Pages / static host SPA fallback for /tornei/*
  (function(){
    try{
      var path = location.pathname + location.search + location.hash;
      // If request was for a SPA path under /tornei/, redirect to the app root with original path encoded
      if(path.startsWith('/tornei/')){
        location.replace('/tornei/?p=' + encodeURIComponent(path));
      }else{
        // fallback: go to site root
        location.replace('/');
      }
    }catch(e){
      // If anything fails, go to root
      location.replace('/');
    }
  })();
</script>
<body>If you are not redirected automatically, <a href="/tornei/">click here to open the app</a>.</body>
