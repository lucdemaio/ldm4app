<!doctype html>
<meta charset="utf-8">
<title>Redirecting...</title>
<script>
  console.log('=== 404.html LOADED ===');
  
  // GitHub Pages SPA fallback for Blazor WebAssembly
  // When a non-existent route is accessed, save it and redirect to index.html
  
  var path = location.pathname;
  var hash = location.hash;
  var search = location.search;
  
  console.log('[404] Full URL:', location.href);
  console.log('[404] Path:', path, 'Search:', search, 'Hash:', hash);
  
  // Only redirect routes that: start with /tornei/, are not index.html, and are not root
  var shouldRedirect = path.startsWith('/tornei/') && 
                       path !== '/tornei/index.html' && 
                       path !== '/tornei/' &&
                       path !== '/tornei';
  
  console.log('[404] Should redirect?', shouldRedirect);
  
  if(shouldRedirect){
    var fullPath = path + search + hash;
    console.log('[404] ✓ REDIRECTING - Saving path:', fullPath);
    
    // Save the original request so index.html can navigate to it
    localStorage.setItem('spa-redirect-path', fullPath);
    localStorage.setItem('spa-redirect-time', Date.now());
    
    console.log('[404] ✓ Saved to localStorage. Redirecting to /tornei/index.html');
    
    // Redirect to index.html
    location.replace('/tornei/index.html' + search + hash);
  } else {
    console.log('[404] ✗ NOT redirecting - path is home or index');
  }
</script>
<body>Redirecting...</body>
