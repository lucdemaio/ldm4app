<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🏆 Gestionale Tornei - PWA</title>
    <base href="/tornei/" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link href="css/custom.css" rel="stylesheet" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="GestionaleTorneiWeb.styles.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    
    <!-- PDF and Image Generation Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- QR library removed (uses canvas/API fallback in locandina-generator.js) -->
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <!-- Unregister existing SWs and clear caches (debug) BEFORE loading the runtime -->
    <script>
        (async function(){
            if ('serviceWorker' in navigator) {
                try { const regs = await navigator.serviceWorker.getRegistrations(); for (const r of regs) { await r.unregister(); } console.log('Service workers unregistered (debug)'); } catch(e){ console.warn('Failed to unregister SW', e); }
            }
            if ('caches' in window){ try { const keys = await caches.keys(); await Promise.all(keys.map(k => caches.delete(k))); console.log('Caches cleared (debug)'); } catch(e){ console.warn('Failed to clear caches', e); } }
            console.log('Service worker registration skipped (debug)');
        })();
    </script>

    <script src="_framework/blazor.webassembly.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="js/download.js"></script>
    <script src="js/pdf-generator.js"></script>
    <script src="js/locandina-generator.js"></script>
</body>

</html>
