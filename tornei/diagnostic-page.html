<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<title>Diagnostica Blazor - Helper</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial; padding:18px; background:#f7f9fb; color:#111}
  label{display:block;margin-top:8px;font-weight:600}
  input[type=text]{width:100%; padding:8px; font-size:14px; margin-top:6px}
  button{margin-top:10px;padding:8px 10px;font-size:14px}
  textarea{width:100%;height:320px;margin-top:12px;font-family:monospace;white-space:pre-wrap;padding:10px}
  .soft{color:#555;font-size:13px;margin-top:6px}
</style>
</head>
<body>
  <h2>Diagnostica Blazor ⚙️</h2>
  <p class="soft">Inserisci l'URL dell'app che rimane in "Loading" e premi <strong>Run diagnostics</strong>. Il report verrà mostrato e copiato negli appunti (se consentito).</p>

  <label>URL dell'app</label>
  <input id="url" type="text" placeholder="https://tuo-dominio/tornei/" value="" />
  <div>
    <button id="run">Run diagnostics</button>
    <button id="open" title="Apri l'URL in una nuova scheda">Open URL</button>
    <button id="copy">Copy report</button>
    <button id="download">Download .txt</button>
  </div>

  <label>Report</label>
  <textarea id="report" readonly placeholder="Il report apparirà qui..."></textarea>

<script>
async function fetchHeadOrGet(href){
  const res={href, headStatus:null, headOk:false, headType:null, headLen:null, getStatus:null, textPreview:null, note:null};
  try{
    const h = await fetch(href, {method:'HEAD', credentials:'omit', cache:'no-store', mode:'cors'});
    res.headStatus = h.status;
    res.headOk = h.ok;
    res.headType = h.headers.get('content-type');
    res.headLen = h.headers.get('content-length');
    if(h.ok && (res.headType && (res.headType.includes('application/json') || res.headType.includes('javascript') || res.headType.includes('text')))){
      const g = await fetch(href, {method:'GET', credentials:'omit', cache:'no-store', mode:'cors'});
      if(g.ok){
        const txt = await g.text();
        res.getStatus = g.status;
        res.textPreview = txt.slice(0,1024);
      } else {
        res.getStatus = g.status;
      }
    } else if(h.ok) {
      try{
        const g = await fetch(href, {method:'GET', credentials:'omit', cache:'no-store', mode:'cors'});
        res.getStatus = g.status;
      }catch(e){ }
    } else {
      try{
        const g = await fetch(href, {method:'GET', cache:'no-store', mode:'no-cors', credentials:'omit'});
        res.note = 'GET no-cors attempted (opaque response possible)';
        res.getStatus = g && g.type === 'opaque' ? 'opaque/0' : (g && g.status ? g.status : 'no-status');
      }catch(e){
        res.note = 'Fetch error: ' + e.message;
      }
    }
  }catch(e){
    try{
      const g = await fetch(href, {method:'GET', cache:'no-store', mode:'no-cors', credentials:'omit'});
      res.note = 'HEAD failed; GET no-cors attempted (opaque)';
      res.getStatus = g && g.type === 'opaque' ? 'opaque/0' : (g && g.status ? g.status : 'no-status');
    }catch(err){
      res.note = 'Fetch error: ' + err.message;
    }
  }
  return res;
}

function appendLn(arr, s){ arr.push(s); }

async function runDiagnostics(target){
  const report=[];
  appendLn(report, 'Report generated: ' + new Date().toLocaleString());
  appendLn(report, '');
  appendLn(report, 'Target URL: ' + target);

  try{
    appendLn(report, '\n--- PAGE GET ---');
    const p = await fetch(target, {method:'GET', cache:'no-store', mode:'cors'});
    appendLn(report, 'GET status: ' + p.status + ' ok:' + p.ok + ' content-type:' + (p.headers.get('content-type')||'[none]'));
    if(p.ok){
      const text = await p.text();
      appendLn(report, 'page size (chars): ' + text.length);
      try{
        const parser = new DOMParser();
        const doc = parser.parseFromString(text, 'text/html');
        const base = doc.querySelector('base')?.getAttribute('href') || '[none]';
        appendLn(report, 'base href: ' + base);
        const scripts = Array.from(doc.querySelectorAll('script[src]')).map(s => s.getAttribute('src'));
        appendLn(report, 'script src entries:');
        scripts.slice(0,50).forEach(s => appendLn(report, ' - ' + s));
      }catch(e){
        appendLn(report, 'HTML parse failed: ' + e.message);
      }
      appendLn(report, '\npage preview (first 1000 chars):');
      appendLn(report, text.slice(0,1000).replace(/\n/g,'\\n'));
    } else {
      appendLn(report, 'GET failed with status ' + p.status + '. Will try GET no-cors fallback.');
      try{
        const p2 = await fetch(target, {method:'GET', cache:'no-store', mode:'no-cors'});
        appendLn(report, 'Fallback GET no-cors -> type: ' + (p2.type || '[unknown]'));
      }catch(e){ appendLn(report, 'Fallback GET error: ' + e.message); }
    }
  }catch(e){
    appendLn(report, 'PAGE FETCH ERROR: ' + e.message);
  }

  appendLn(report, '\n--- SERVICE WORKER FILES ---');
  const swCandidates = ['/service-worker.js','/service-worker.published.js','/service-worker-assets.js'];
  for(const sw of swCandidates){
    appendLn(report, '\nChecking ' + sw);
    const r = await fetchHeadOrGet(new URL(sw, target).href);
    appendLn(report, JSON.stringify(r, null, 2));
  }

  appendLn(report, '\n--- CRITICAL ASSETS (_framework) ---');
  const assets = ['/_framework/blazor.boot.json','/_framework/blazor.webassembly.js','/_framework/dotnet.native.wasm','/_framework/GestionaleTorneiWeb.wasm'];
  for(const a of assets){
    appendLn(report, '\nChecking ' + a);
    const r = await fetchHeadOrGet(new URL(a, target).href);
    appendLn(report, JSON.stringify(r, null, 2));
  }

  appendLn(report, '\n--- OTHER CHECKS ---');
  const other = ['/GestionaleTorneiWeb.styles.css','/index.html','/manifest.webmanifest','/favicon.png'];
  for(const o of other){
    appendLn(report, '\nChecking ' + o);
    const r = await fetchHeadOrGet(new URL(o, target).href);
    appendLn(report, JSON.stringify(r, null, 2));
  }

  appendLn(report, '\n--- NOTES ---');
  appendLn(report, "If you see 'HEAD' 404 or GET 404 for _framework assets -> the server isn't serving them at that path (check base href / deploy).");
  appendLn(report, "If many responses show 'opaque/0' or HEAD failed -> CORS or server denies cross-origin header access; try running the same checks from the same origin (open this diagnostic page on the same host) or use browser DevTools/har.");

  return report.join('\n');
}

document.getElementById('run').onclick = async function(){
  const target = (document.getElementById('url').value || '').trim();
  if(!target){ alert('Inserisci un URL valido (incluso https://...)'); return; }
  this.disabled = true;
  document.getElementById('report').value = 'Running... attendere...';
  try{
    const out = await runDiagnostics(target);
    document.getElementById('report').value = out;
    try{ await navigator.clipboard.writeText(out); alert('Report copiato negli appunti. Incolla qui (Ctrl+V).'); }catch(e){}
  }catch(e){
    document.getElementById('report').value = 'Errore durante la diagnosi: ' + e.message;
  } finally {
    this.disabled = false;
  }
};

document.getElementById('copy').onclick = function(){
  const t = document.getElementById('report').value;
  if(!t) return alert('Nessun report disponibile');
  navigator.clipboard.writeText(t).then(()=>alert('Report copiato.')).catch(()=>prompt('Copia manuale:', t));
};
document.getElementById('open').onclick = function(){ const u=document.getElementById('url').value.trim(); if(u) window.open(u,'_blank'); };
document.getElementById('download').onclick = function(){
  const t = document.getElementById('report').value;
  if(!t) return alert('Nessun report disponibile');
  const b = new Blob([t], {type:'text/plain;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'diagnostic-report.txt'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
};
</script>
</body>
</html>
