<?xml version="1.0" encoding="UTF-8"?>
<svg width="2048" height="1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0A1929;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1A2535;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2B3D50;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="sunGradient">
      <stop offset="0%" style="stop-color:#6B8CAE;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6B8CAE;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#6B8CAE;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Sky background -->
  <rect width="2048" height="1024" fill="url(#skyGradient)"/>
  
  <!-- Sun/Moon -->
  <circle cx="1600" cy="300" r="120" fill="url(#sunGradient)"/>
  
  <!-- Clouds -->
  <ellipse cx="300" cy="200" rx="150" ry="60" fill="#3B4D60" opacity="0.7"/>
  <ellipse cx="800" cy="350" rx="200" ry="80" fill="#3B4D60" opacity="0.6"/>
  <ellipse cx="1400" cy="250" rx="180" ry="70" fill="#3B4D60" opacity="0.65"/>
  <ellipse cx="500" cy="500" rx="220" ry="90" fill="#3B4D60" opacity="0.55"/>
  <ellipse cx="1600" cy="600" rx="190" ry="75" fill="#3B4D60" opacity="0.6"/>
</svg>