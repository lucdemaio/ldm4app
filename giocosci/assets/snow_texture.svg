<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="snowPattern" x="0" y="0" width="64" height="64" patternUnits="userSpaceOnUse">
      <rect width="64" height="64" fill="#FFFFFF"/>
      <!-- Sparkles -->
      <circle cx="10" cy="10" r="1.5" fill="#FFFFFF" opacity="0.8"/>
      <circle cx="30" cy="25" r="1" fill="#FFFFFF" opacity="0.7"/>
      <circle cx="50" cy="15" r="1.2" fill="#FFFFFF" opacity="0.75"/>
      <circle cx="20" cy="45" r="1.3" fill="#FFFFFF" opacity="0.8"/>
      <circle cx="55" cy="50" r="1" fill="#FFFFFF" opacity="0.7"/>
      <!-- Shadows -->
      <circle cx="15" cy="35" r="3" fill="#F0F8FF" opacity="0.3"/>
      <circle cx="45" cy="40" r="2.5" fill="#F0F8FF" opacity="0.25"/>
      <circle cx="35" cy="55" r="2" fill="#F0F8FF" opacity="0.2"/>
    </pattern>
  </defs>
  
  <rect width="512" height="512" fill="url(#snowPattern)"/>
</svg>