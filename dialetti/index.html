<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#222" />
  <title>PWA Riconoscimento Oggetti - Dialetti</title>

  <!-- Manifest per rendere l'app installabile -->
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
  <!-- Font moderni per UI 2026 -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">


</head>
<body>
  <!-- Video a schermo intero (sfondo) -->
  <video id="video" autoplay muted playsinline></video>

  <!-- Overlay centrato con controlli e risultati -->
  <div class="overlay">
    <div class="glass-panel" id="controlsPanel" role="region" aria-label="Controlli principali">
      <div class="top-row">
        <div class="select-wrap">
          <label for="dialect">Dialetto</label>
          <select id="dialect" aria-label="Scegli dialetto">
            <option value="" disabled selected>Seleziona dialetto...</option>
            <option value="Romano">Romano</option>
            <option value="Veneto">Veneto</option>
            <option value="Bergamasco">Bergamasco</option>
            <option value="Milanese">Milanese</option>
            <option value="Napoletano">Napoletano</option>
            <option value="Siciliano">Siciliano</option>
          </select>
        </div>
        <div class="gesture-hint">Tocca il video per avviare • Swipe ↑ per dettagli</div>
      </div>

      <div class="bento-grid" id="bentoGrid" aria-live="polite" aria-atomic="true">
        <!-- Carte create dinamicamente -->
      </div>

      <div class="bottom-row">
        <!-- Rendi visibile il bottone start per avere un accesso diretto al riconoscimento -->
        <button id="retryModelBtn" class="ghost-btn">Riprova modello</button>
        <button id="startBtn" class="ghost-btn">Avvia riconoscimento</button>
        <textarea id="results" readonly rows="3" aria-label="Risultati">Avvia il riconoscimento per vedere i risultati qui.</textarea>
        <div id="status" class="status">Modello non caricato</div>
      </div>
    </div>

    <!-- Anello di rilevamento / effetto pulse neon -->
    <div id="detectionRing" aria-hidden="true"></div>

    <!-- Pannello dettagli (swipe up) -->
    <div id="detailPanel" class="detail-panel" hidden>
      <div class="handle" aria-hidden="true"></div>
      <div id="detailsContent">Dettagli riconoscimento</div>
    </div> 
  </div>

  <!-- Debug button & panel (fuori dall'overlay per garantire click sui dispositivi) -->
  <!-- Fallback: onclick inline che chiama window.toggleDebugFallback per funzionare anche se app.js non è bloccato da errori -->
  <button id="debugBtn" class="debug-btn" aria-label="Apri debug" type="button" onclick="(window.toggleDebugFallback?window.toggleDebugFallback():null)">🐞</button>

  <div id="debugPanel" class="debug-panel" hidden>
    <div class="debug-header">
      <strong>Debug</strong>
      <div class="debug-actions">
        <button id="clearLogs" title="Pulisci log" type="button">Pulisci</button>
        <button id="downloadLogs" title="Esporta" type="button">Esporta</button>
        <button id="exportReport" title="Esporta report" type="button">Esporta Report</button>
        <label style="display:inline-flex;align-items:center;gap:6px;margin-left:8px"><input id="preventClose" type="checkbox"> Previeni chiusura</label>
        <button id="unregisterSW" title="Rimuovi Service Worker" type="button">Unreg SW</button>
        <button id="closeDebug" title="Chiudi" type="button">✕</button>
      </div>
    </div>
    <div id="debugLogs" class="debug-logs" role="log" aria-live="polite"></div>
  </div>

  <!-- Export modal: mostra JSON dei log e fornisce Download/Copy fallback per mobile -->
  <div id="logExportModal" class="export-modal" hidden aria-hidden="true" role="dialog" aria-label="Export log">
    <div class="export-overlay" id="exportOverlay"></div>
    <div class="export-panel">
      <div class="export-header"><strong>Esporta log</strong><button id="closeLogModal" title="Chiudi" type="button">✕</button></div>
      <div class="export-body">
        <textarea id="logExportTextarea" readonly rows="12" aria-label="Log JSON"></textarea>
        <div class="export-actions">
          <button id="downloadLogBtn" class="ghost-btn">Scarica</button>
          <button id="copyLogBtn" class="ghost-btn">Copia negli appunti</button>
        </div>
        <div id="logExportStatus" class="status" aria-live="polite"></div>
      </div>
    </div>
  </div>

  <!-- Fallback JS minimo: definisce toggleDebugFallback per aprire il pannello se app.js non è eseguito -->
  <script>
    window.toggleDebugFallback = function(){
      try{
        // mark that fallback was used so the module-level handler ignores the next click
        window._toggleDebugFallbackUsed = true;
        const p = document.getElementById('debugPanel');
        if (!p) return;
        if (p.hidden) { p.hidden = false; p.style.transform = 'translateY(0)'; }
        else { p.style.transform = 'translateY(12px)'; setTimeout(()=> p.hidden = true, 260); }
        // remove flag shortly after to avoid blocking real clicks
        setTimeout(()=> { window._toggleDebugFallbackUsed = false; }, 500);
      }catch(e){ console.error('toggleDebugFallback error', e); }
    };
    // piccolo indicatore per debugging
    console.log('Debug fallback injected');
  </script>

  <!-- Script principale come modulo per usare import dinamici. Fallback dinamico per caricare app.js sia da percorso relativo che da possibile percorso assoluto usato in deploy -->
  <script type="module">
    (async ()=>{
      try{
        await import('./app.js');
        console.log('app.js caricato (relative)');
      }catch(e){
        console.warn('app.js failed from ./app.js — trying absolute fallback', e);
        try{
          await import('/pwa-object-recognition/app.js');
          console.log('app.js caricato (absolute fallback)');
        }catch(e2){
          console.error('Impossibile caricare app.js da alcun percorso', e2);
          // Mostra messaggio visibile in UI
          const s = document.getElementById('status'); if (s) s.textContent = 'Errore caricamento app.js';
        }
      }
    })();
  </script>
</body>
</html>
