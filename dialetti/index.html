<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#222" />
  <title>PWA Riconoscimento Oggetti - Dialetti</title>

  <!-- Manifest per rendere l'app installabile -->
  <link rel="manifest" href="/pwa-object-recognition/manifest.json">
  <link rel="stylesheet" href="/pwa-object-recognition/styles.css">
  <!-- Font moderni per UI 2026 -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">


</head>
<body>
  <!-- Video a schermo intero (sfondo) -->
  <video id="video" autoplay muted playsinline></video>

  <!-- Overlay centrato con controlli e risultati -->
  <div class="overlay">
    <div class="glass-panel" id="controlsPanel" role="region" aria-label="Controlli principali">
      <div class="top-row">
        <div class="select-wrap">
          <label for="dialect">Dialetto</label>
          <select id="dialect" aria-label="Scegli dialetto">
            <option value="" disabled selected>Seleziona dialetto...</option>
            <option value="Romano">Romano</option>
            <option value="Veneto">Veneto</option>
            <option value="Bergamasco">Bergamasco</option>
            <option value="Milanese">Milanese</option>
            <option value="Napoletano">Napoletano</option>
            <option value="Siciliano">Siciliano</option>
          </select>
        </div>
        <div class="gesture-hint">Tocca il video per avviare • Swipe ↑ per dettagli</div>
      </div>

      <div class="bento-grid" id="bentoGrid" aria-live="polite" aria-atomic="true">
        <!-- Carte create dinamicamente -->
      </div>

      <div class="bottom-row">
        <!-- Rendi visibile il bottone start per avere un accesso diretto al riconoscimento -->
        <button id="startBtn" class="ghost-btn">Avvia riconoscimento</button>
        <textarea id="results" readonly rows="3" aria-label="Risultati">Avvia il riconoscimento per vedere i risultati qui.</textarea>
        <div id="status" class="status">Modello non caricato</div>
      </div>
    </div>

    <!-- Anello di rilevamento / effetto pulse neon -->
    <div id="detectionRing" aria-hidden="true"></div>

    <!-- Pannello dettagli (swipe up) -->
    <div id="detailPanel" class="detail-panel" hidden>
      <div class="handle" aria-hidden="true"></div>
      <div id="detailsContent">Dettagli riconoscimento</div>
    </div>

    <!-- Pannello dettagli (swipe up) -->
    <div id="detailPanel" class="detail-panel" hidden>
      <div class="handle" aria-hidden="true"></div>
      <div id="detailsContent">Dettagli riconoscimento</div>
    </div>
  </div>

  <!-- Debug button & panel (fuori dall'overlay per garantire click sui dispositivi) -->
  <!-- Fallback: onclick inline che chiama window.toggleDebug per funzionare anche se app.js non è bloccato da errori -->
  <button id="debugBtn" class="debug-btn" aria-label="Apri debug" onclick="(window.toggleDebug?window.toggleDebug():null)">🐞</button>

  <div id="debugPanel" class="debug-panel" hidden>
    <div class="debug-header">
      <strong>Debug</strong>
      <div class="debug-actions">
        <button id="clearLogs" title="Pulisci log">Pulisci</button>
        <button id="downloadLogs" title="Esporta">Esporta</button>
        <button id="unregisterSW" title="Rimuovi Service Worker">Unreg SW</button>
        <button id="closeDebug" title="Chiudi">✕</button>
      </div>
    </div>
    <div id="debugLogs" class="debug-logs" role="log" aria-live="polite"></div>
  </div>

  <!-- Fallback JS minimo: definisce toggleDebug per aprire il pannello se app.js non è eseguito -->
  <script>
    window.toggleDebug = function(){
      try{
        const p = document.getElementById('debugPanel');
        if (!p) return;
        if (p.hidden) { p.hidden = false; p.style.transform = 'translateY(0)'; }
        else { p.style.transform = 'translateY(12px)'; setTimeout(()=> p.hidden = true, 260); }
      }catch(e){ console.error('toggleDebug fallback error', e); }
    };
    // piccolo indicatore per debugging
    console.log('Debug fallback injected');
  </script>

  <!-- Script principale come modulo per usare import dinamici -->
  <script type="module" src="/pwa-object-recognition/app.js"></script>
</body>
</html>
